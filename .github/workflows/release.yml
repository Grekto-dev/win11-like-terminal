name: Build and Release .deb

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-deb:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            qt6-base-dev \
            qt6-declarative-dev \
            qt6-shadertools-dev \
            libqt6svg6-dev \
            libvterm-dev \
            libgl1-mesa-dev \
            libxcb1-dev \
            dpkg-dev \
            file

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: |
          cmake --build build

      - name: Package .deb with CPack
        run: |
          cd build
          cpack -G DEB
          ls -la *.deb

      - name: Upload .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: win11-like-terminal-deb
          path: build/*.deb

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.deb
          generate_release_notes: true
